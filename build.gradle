plugins {
    id("java")
    id("com.gradleup.shadow") version "9.4.1"
}

group = "net.gemcraft.hub"
version = "1.0"

repositories {
    mavenCentral()

    maven {
        url = 'https://jitpack.io'
    }
}

dependencies {
    // Netty
    implementation("io.netty:netty-transport:4.2.19.Final")
    implementation("io.netty:netty-handler:4.2.19.Final")

    // JLine
    implementation("org.jline:jline-reader:4.4.8")
    implementation("org.jline:jline-terminal-jni:4.4.8")

    // Adventure
    implementation("net.kyori:adventure-api:5.1.1")
    implementation("net.kyori:adventure-nbt:5.1.1")
    implementation("net.kyori:adventure-text-serializer-gson:5.1.1")
    implementation("net.kyori:adventure-text-serializer-plain:5.1.1")
    implementation("net.kyori:adventure-text-minimessage:5.1.1")

    // Other
    implementation("com.google.code.gson:gson:2.14.0")
    implementation("com.github.Querz:NBT:6.1")
}

tasks {
    jar {
        manifest {
            attributes["Main-Class"] = "net.gemcraft.hub.Hub"
        }
    }

    shadowJar {
        archiveVersion.set("")
        archiveClassifier.set("")
    }
}